[package]
name = "lecture-studio-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lecture-studio-security = { path = "../security" }
lecture-studio-history = { path = "../history" }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
