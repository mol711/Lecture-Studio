[package]
name = "lecture-studio-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
hex = "0.4"
lecture-studio-history = { path = "../../core/history" }
lecture-studio-security = { path = "../../core/security" }
lecture-studio-workspace = { path = "../../core/workspace" }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
